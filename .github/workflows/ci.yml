name: CI

on:
  push:
    branches: [main]
    paths:
      # Skip docs-only changes. `paths-ignore` can't re-include, so use `paths`: patterns apply in
      # order and a later match wins. docs/file-format.md is generated and unit-tested, so it runs CI.
      - '**'
      - '!PLAN.md'
      - '!CLAUDE.md'
      - '!README.md'
      - '!CONTRIBUTING.md'
      - '!docs/**'
      - 'docs/file-format.md'
  pull_request:
    paths:
      - '**'
      - '!PLAN.md'
      - '!CLAUDE.md'
      - '!README.md'
      - '!CONTRIBUTING.md'
      - '!docs/**'
      - 'docs/file-format.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GitHub Pages serves a project site from /<repo>/; vite.config.ts and playwright.config.ts
  # both read this, so forks under another name still work.
  ALGORHYTHMS_BASE: /${{ github.event.repository.name }}/

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:perf
      - run: pnpm build
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # One E2E job per (browser, part). `timing` runs the @perf/@latency gates alone on a quiet runner
  # (one worker, not sharded); parts 1-3 split the rest with --shard (per test: fullyParallel).
  # Every part runs on every push, and deploy needs them all.
  e2e-linux:
    name: E2E (${{ matrix.browser }}, ${{ matrix.part == 'timing' && 'timing gates' || format('shard {0}/3', matrix.part) }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        part: [timing, '1', '2', '3']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Install system dependencies (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - name: Start a null audio sink
        # Runners have no sound card; a PulseAudio null sink lets live AudioContexts run.
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: E2E timing gates (@perf, @latency), one worker
        if: matrix.part == 'timing'
        run: pnpm e2e --project='${{ matrix.browser }}-*' --grep '@perf|@latency' --workers=1
      - name: E2E functional specs, shard ${{ matrix.part }}/3
        if: matrix.part != 'timing'
        run: pnpm e2e --project='${{ matrix.browser }}-*' --grep-invert '@perf|@latency' --shard=${{ matrix.part }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.part }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-webkit:
    name: E2E (WebKit on macOS, ${{ matrix.part == 'timing' && 'timing gates' || format('shard {0}/3', matrix.part) }})
    # Playwright's WebKit on Linux is not Safari and may lack working audio (PLAN.md §14).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        part: [timing, '1', '2', '3']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-${{ runner.os }}-webkit-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install webkit
      - name: E2E timing gates (@perf, @latency), one worker
        if: matrix.part == 'timing'
        run: pnpm e2e --project='webkit-*' --grep '@perf|@latency' --workers=1
      - name: E2E functional specs, shard ${{ matrix.part }}/3
        if: matrix.part != 'timing'
        run: pnpm e2e --project='webkit-*' --grep-invert '@perf|@latency' --shard=${{ matrix.part }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-webkit-${{ matrix.part }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A matrix job in `needs` requires every one of its entries to succeed.
    needs: [check, e2e-linux, e2e-webkit]
    runs-on: ubuntu-latest
    # Requires Settings → Pages → Source: "GitHub Actions".
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
