name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GitHub Pages serves a project site from /<repo>/; vite.config.ts and playwright.config.ts
  # both read this, so forks under another name still work.
  ALGORHYTHMS_BASE: /${{ github.event.repository.name }}/

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:perf
      - run: pnpm build
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e-linux:
    name: E2E (Chromium, Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Start a null audio sink
        # Runners have no sound card; a PulseAudio null sink lets live AudioContexts run.
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - run: pnpm e2e --project='chromium-*' --project='firefox-*'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-webkit:
    name: E2E (WebKit on macOS)
    # Playwright's WebKit on Linux is not Safari and may lack working audio (PLAN.md §14).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - run: pnpm e2e --project='webkit-*'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e-linux, e2e-webkit]
    runs-on: ubuntu-latest
    # Requires Settings → Pages → Source: "GitHub Actions".
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
